name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: Boot ${{ matrix.boot }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: ['3.0.13', '3.5.9', '4.0.1']
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: mvn -B verify -Dspring.boot.version=${{ matrix.boot }}

  database-compatibility:
    name: Database compatibility
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Free disk space for the Oracle image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Oracle, MySQL and MariaDB
        run: mvn -B test -Pcompat -Djacoco.skip=true

  consumer-resolution:
    name: Consumer resolution (Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: ['3.0.13', '3.5.9', '4.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install starter to the local repository
        run: mvn -B -q install -DskipTests -Djacoco.skip=true
      - name: Assert the starter leaks no Spring artifacts
        run: .github/scripts/consumer-probe.sh "${{ matrix.boot }}"

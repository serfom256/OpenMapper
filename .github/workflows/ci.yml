name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Compiles and runs the full suite (unit + Testcontainers integration) against
  # every supported Spring Boot line. ${spring.boot.version} swaps the imported
  # Boot BOM, so this is the whole compatibility contract in one knob.
  build:
    name: Boot ${{ matrix.boot }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: ['3.0.13', '3.5.9', '4.0.1']
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: mvn -B verify -Dspring.boot.version=${{ matrix.boot }}

  # Guards the thing unit tests cannot see: what a downstream application actually
  # resolves. openMapper must contribute no Spring artifacts of its own, or a
  # consumer can end up with two Spring versions on one classpath.
  consumer-resolution:
    name: Consumer resolution (Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: ['3.0.13', '3.5.9', '4.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install starter to the local repository
        run: mvn -B -q install -DskipTests -Djacoco.skip=true
      - name: Assert the starter leaks no Spring artifacts
        run: .github/scripts/consumer-probe.sh "${{ matrix.boot }}"

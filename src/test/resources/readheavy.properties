# OpenMapper settings for the read-heavy throughput suite (ReadHeavyBenchmark).
# Query cache ON, mirroring the user's OpenMapperTest project.
openmapper.dao.packagesToScan=io.github.serfom256.benchmark
openmapper.query.cache.enabled=true
openmapper.logging.enabled=false
openmapper.sql.tracing.enabled=false
openmapper.sql.tracing.queries.enabled=false
